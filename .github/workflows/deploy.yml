
name: Deploy to Google Play

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      manual_track:
        description: 'track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Determine Build Options
        id: options
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          BUILD_MOBILE=true
          BUILD_WEAR=true
          DEPLOY_PLAY=true

          if [[ "$TAG" == *"-indev"* ]]; then
            DEPLOY_PLAY=false
          fi

          if [[ "$TAG" == *"mobile_only"* ]]; then
            BUILD_WEAR=false
          fi

          if [[ "$TAG" == *"wear_only"* ]]; then
            BUILD_MOBILE=false
          fi

          echo "build_mobile=$BUILD_MOBILE" >> "$GITHUB_OUTPUT"
          echo "build_wear=$BUILD_WEAR" >> "$GITHUB_OUTPUT"
          echo "deploy_play=$DEPLOY_PLAY" >> "$GITHUB_OUTPUT"

          echo "Mobile: $BUILD_MOBILE"
          echo "Wear: $BUILD_WEAR"
          echo "Google Play: $DEPLOY_PLAY"

      - name: Determine Google Play Track
        id: determine_track
        if: steps.options.outputs.deploy_play == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MOBILE="${{ inputs.manual_track }}"
            WEAR="${{ inputs.manual_track }}"
          else
            TAG="${GITHUB_REF_NAME}"

            if [[ "$TAG" == *"-alpha"* ]]; then
              MOBILE="alpha"
              WEAR="alpha"
            elif [[ "$TAG" == *"-beta"* ]]; then
              MOBILE="beta"
              WEAR="beta"
            else
              MOBILE="production"
              WEAR="production"
            fi
          fi

          echo "mobile_track=$MOBILE" >> "$GITHUB_OUTPUT"
          echo "wear_track=$WEAR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;27.2.12479018"

      - name: Decode Keystore
        run: |
          if [[ "${{ steps.options.outputs.build_wear }}" == "true" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app_wearable/release.jks
          fi

          if [[ "${{ steps.options.outputs.build_mobile }}" == "true" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app_mobile/release.jks
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release
        run: |
          TASKS=""

          if [[ "${{ steps.options.outputs.build_mobile }}" == "true" ]]; then
            TASKS="$TASKS :app_mobile:bundleRelease :app_mobile:assembleRelease"
          fi

          if [[ "${{ steps.options.outputs.build_wear }}" == "true" ]]; then
            TASKS="$TASKS :app_wearable:bundleRelease :app_wearable:assembleRelease"
          fi

          ./gradlew $TASKS
        env:
          ANDROID_KEYSTORE_FILE: release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Mobile to Google Play
        if: |
          steps.options.outputs.deploy_play == 'true' &&
          steps.options.outputs.build_mobile == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
          packageName: com.dertefter.etcetera
          releaseFiles: app_mobile/build/outputs/bundle/release/app_mobile-release.aab
          mappingFile: app_mobile/build/outputs/mapping/release/mapping.txt
          debugSymbols: app_mobile/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          status: draft
          tracks: ${{ steps.determine_track.outputs.mobile_track }}

      - name: Upload Wearable to Google Play
        if: |
          steps.options.outputs.deploy_play == 'true' &&
          steps.options.outputs.build_wear == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
          packageName: com.dertefter.etcetera
          releaseFiles: app_wearable/build/outputs/bundle/release/app_wearable-release.aab
          mappingFile: app_wearable/build/outputs/mapping/release/mapping.txt
          debugSymbols: app_wearable/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          status: draft
          tracks: ${{ steps.determine_track.outputs.wear_track }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.options.outputs.build_mobile == 'true' && 'app_mobile/build/outputs/apk/release/app_mobile-release.apk' || '' }}
            ${{ steps.options.outputs.build_wear == 'true' && 'app_wearable/build/outputs/apk/release/app_wearable-release.apk' || '' }}
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-indev') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
